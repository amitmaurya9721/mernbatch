<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form>
        <table cellpadding="12" cellspacing="7">
            <tr>
                <td>Name:</td>
                <td><input type="text" placeholder=""></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" placeholder=""></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email" placeholder=""></td>
            </tr>
            <tr>
                <td>Phone Number:</td>
                <td><input type="number" placeholder=""></td>
            </tr>
            <tr>
                <td>Sex:</td>
                <td>
                    <input type="radio" name="gender" value="Male">Male
                    <input type="radio" name="gender" value="Female">Female
                    <input type="radio" name="gender" value="Common">Common
                </td>
            </tr>
            <tr>
                <td>Date of Birth:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td valign="top"><label>Address:</label></td>
                <td><textarea name="Address" rows="8" cols="30"></textarea></td>
            </tr>
            <td align="left">
                <input type="submit" value="Submit">
            </td>
            <td align="center">
                <input type="reset" value="Reset">
            </td>
          </tr>
    </table>

    </form>
</body>
</html>
