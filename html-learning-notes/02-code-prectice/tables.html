<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tables</title>
</head>

<body>
    <table border ="1">
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rahul</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Priya</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
