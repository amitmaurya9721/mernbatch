<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Forms</title>
</head>

<body>
    <form action="/submit" method="POST">
        <label for="name">Name:</label><input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><input type="email" id="email" name="email" required><br><br>
        <label>Gender:</label><label><input type="radio" name="gender" value="male"> Male</label><label><input
                type="radio" name="gender" value="female"> Female</label><br><br>
        <label><input type="checkbox" name="skill" value="html"> HTML</label><label><input type="checkbox" name="skill"
                value="css"> CSS</label><br><br>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
