<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Lists</title>
</head>

<body>
    <h2>Ordered List</h2>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
    </ol>
    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
    </ul>
    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Structure banane wali language</dd>
    </dl>
</body>

</html>
