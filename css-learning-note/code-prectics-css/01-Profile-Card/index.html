<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="profile-card">
    <div class="cover"></div>
    <div class="avatar">AM</div>
    <div class="content">
      <span class="tag">WEB DEVELOPER</span>
      <h1>Your Name</h1>
      <p class="subtitle">B.Tech Student | Frontend Developer</p>
      <p class="bio">I enjoy learning new technologies and building clean, useful and responsive websites.</p>
      <div class="skills">
        <span>HTML</span><span>CSS</span><span>JavaScript</span>
      </div>
      <div class="actions">
        <a class="primary-btn" href="mailto:hello@example.com">Contact Me</a>
        <a class="secondary-btn" href="#about">About</a>
      </div>
    </div>
  </main>
</body>

</html>
