<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        nav {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #26364a;
            color: white;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero button {
            padding: 12px 25px;
            margin-top: 20px;
            border: none;
            background: orange;
            cursor: pointer;
            border-radius: 5px;
        }

        section {
            padding: 40px 20px;
            text-align: center;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="hero" id="home">
        <h1>Hello, I'm Rahul</h1>
        <p>Frontend Developer | Student | Learner</p>
        <button>Explore My Work</button>
    </div>

    <section id="about">
        <h2>About Me</h2>
        <p>I am learning HTML and CSS to become a web developer.</p>
    </section>

    <section id="skills">
        <h2>My Skills</h2>
        <br>
        <div class="skills">
            <div class="skill">HTML</div>
            <div class="skill">CSS</div>
            <div class="skill">GitHub</div>
            <div class="skill">Web Design</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <p>Email: example@gmail.com</p>
    </section>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
